      osu!lazer typeface. The UI font is Torus (with Torus-Alternate); these are
      proprietary and loaded from /fonts only if you provide the licensed files
      (see public/fonts/README.md) or have them installed. Inter - also part of
      lazer's font set and freely licensed - is loaded here as the fallback.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

[package]
name = "cascade"
version = "0.0.0"
description = "Cascade, a VSRG editor for osu!mania, StepMania and Etterna"
authors = ["sheepex"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
zip = { version = "8", default-features = false, features = ["deflate"] }
discord-rich-presence = "1"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2" }
tauri-plugin-updater = { version = "2" }
tauri-plugin-process = { version = "2" }

[target.'cfg(windows)'.dependencies]
wasapi = "0.24"
winreg = "0.56"
rosu-mem = "3"
# Must track the version rosu-mem uses, so the HANDLE it hands back is the same
# type we close.
windows = { version = "0.48", features = ["Win32_Foundation"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

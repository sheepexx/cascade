[package]
name = "cascade"
version = "0.0.0"
description = "Cascade, a VSRG editor for osu!mania, StepMania and Etterna"
authors = ["sheepex"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

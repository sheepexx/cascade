      :root {

      .shell { display: flex; flex-direction: column; min-height: 100%; max-width: 860px; margin: 0 auto; padding: 26px 24px 40px; }

      .stage { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 56px; padding: 40px 0; }
      .eyebrow { margin: 0 0 14px; color: var(--accent); font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.08em; }
      h1 { margin: 0 0 14px; color: var(--text); font-size: clamp(2rem, 5.5vw, 2.9rem); font-weight: 700; line-height: 1.1; letter-spacing: -0.035em; }
      .lede { margin: 0; max-width: 30rem; font-size: 1.05rem; }
      code { padding: 1px 6px; border-radius: 5px; background: rgba(255, 255, 255, 0.06); color: var(--text); font-family: var(--mono); font-size: 0.85em; word-break: break-all; }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
      .btn { display: inline-flex; align-items: center; justify-content: center; padding: 9px 18px; border: 1px solid #33333f; border-radius: 8px; color: var(--text); background: #1d1d27; font-size: 0.9rem; font-weight: 600; text-decoration: none; transition: background 0.15s ease, border-color 0.15s ease; }

      .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b0b10; }

      .play { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 0; }
      .play canvas { display: block; width: 232px; height: 440px; border-radius: 14px; background: var(--well); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.09), 0 30px 60px -30px rgba(0, 0, 0, 0.9); touch-action: none; cursor: pointer; -webkit-tap-highlight-color: transparent; }

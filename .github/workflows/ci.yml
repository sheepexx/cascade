name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  web-and-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The root test run includes the worker's tests, which need its packages.
      - run: npm ci
        working-directory: worker
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run typecheck
        working-directory: worker

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:integration
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-traces
          path: tests/integration/.results
          retention-days: 7

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      # The same toolchain the desktop release builds with.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libgtk-3-dev libdrm-dev
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Test Linux display clock fallback
        run: |
          cc -std=c11 -Wall -Wextra -Werror $(pkg-config --cflags libdrm) \
            src-tauri/tests/linux_vblank_test.c -o /tmp/cascade-vblank-test -ldl -pthread
          /tmp/cascade-vblank-test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

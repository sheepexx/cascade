name: Desktop build

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the installers"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installers
        run: npm run desktop:build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Collect installers
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} out/ \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: cascade-windows-${{ steps.version.outputs.value }}
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('desktop-v{0}', steps.version.outputs.value) }}
          name: Cascade ${{ steps.version.outputs.value }}
          files: out/*
          draft: true
          generate_release_notes: true

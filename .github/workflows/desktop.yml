name: Desktop build

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the installers for download"
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            target: ""
          - os: ubuntu-22.04
            platform: linux
            target: ""
          - os: macos-latest
            platform: macos
            target: universal-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add macOS targets
        if: matrix.platform == 'macos'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf \
            build-essential \
            file

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform }}

      - name: Install npm dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installers
        shell: bash
        run: |
          if [ -n "${{ matrix.target }}" ]; then
            npm run desktop:build -- --target "${{ matrix.target }}"
          else
            npm run desktop:build
          fi
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Collect installers
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -eu
          mkdir -p out
          collect() {
            find src-tauri/target -type d -name bundle -prune -exec find {} -type f -name "$1" \; | while read -r f; do
              cp "$f" out/
            done
          }
          case "$PLATFORM" in
            windows)
              collect "*.msi"
              collect "*-setup.exe"
              collect "*-setup.exe.sig"
              cp src-tauri/target/release/cascade.exe "out/Cascade_${VERSION}_portable.exe"
              ;;
            linux)
              collect "*.AppImage"
              collect "*.AppImage.sig"
              collect "*.AppImage.tar.gz"
              collect "*.AppImage.tar.gz.sig"
              collect "*.deb"
              collect "*.rpm"
              ;;
            macos)
              collect "*.dmg"
              collect "*.app.tar.gz"
              collect "*.app.tar.gz.sig"
              ;;
          esac
          ls -la out

      - name: Sign the portable exe
        if: matrix.platform == 'windows'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri signer sign "out/Cascade_${VERSION}_portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: cascade-${{ matrix.platform }}-${{ steps.version.outputs.value }}
          path: out/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read version
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -eu
          mkdir -p out
          find artifacts -type f -exec cp {} out/ \;
          ls -la out

      - name: Build manifests
        env:
          VERSION: ${{ steps.version.outputs.value }}
          WORKER: https://mania-editor.noahcraft01.workers.dev
        run: node scripts/build-desktop-manifests.mjs

      - name: Publish to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          for path in out/*; do
            f=$(basename "$path")
            case "$f" in
              latest.json|update.json) continue ;;
            esac
            case "$f" in
              *.sig) type=text/plain ;;
              *) type=application/octet-stream ;;
            esac
            npx --yes wrangler@4.122.0 r2 object put \
              "cascade-shared/desktop/${VERSION}/${f}" \
              --file "$path" --content-type "$type" --remote
          done

          for f in latest.json update.json; do
            npx --yes wrangler@4.122.0 r2 object put \
              "cascade-shared/desktop/${f}" \
              --file "out/${f}" --content-type application/json --remote
          done

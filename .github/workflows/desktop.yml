name: Desktop build

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the installers for download"
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Read version
        id: version
        shell: bash
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build installers
        run: npm run desktop:build
        env:
          VITE_WORKER_URL: ${{ vars.VITE_WORKER_URL }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Collect installers
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \( -name "*.msi" -o -name "*-setup.exe" \) -exec cp {} out/ \;
          cp src-tauri/target/release/cascade.exe "out/Cascade_${VERSION}_portable.exe"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: cascade-windows-${{ steps.version.outputs.value }}
          path: out/*
          if-no-files-found: error

      - name: Use Node 22 for wrangler
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to R2
        if: startsWith(github.ref, 'refs/tags/desktop-v') || inputs.release
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -eu
          setup=$(basename out/*-setup.exe)
          msi=$(basename out/*.msi)
          portable=$(basename out/*_portable.exe)

          for f in "$setup" "$msi" "$portable"; do
            npx --yes wrangler@4.122.0 r2 object put \
              "cascade-shared/desktop/${VERSION}/${f}" \
              --file "out/${f}" --content-type application/octet-stream
          done

          node -e '
            const fs = require("fs");
            const [setup, msi, portable, version] = process.argv.slice(1);
            const size = (name) => fs.statSync(`out/${name}`).size;
            fs.writeFileSync(
              "out/latest.json",
              JSON.stringify({
                version,
                publishedAt: new Date().toISOString(),
                files: {
                  setup: { name: setup, size: size(setup) },
                  msi: { name: msi, size: size(msi) },
                  portable: { name: portable, size: size(portable) },
                },
              }),
            );
          ' "$setup" "$msi" "$portable" "$VERSION"

          npx --yes wrangler@4.122.0 r2 object put \
            "cascade-shared/desktop/latest.json" \
            --file out/latest.json --content-type application/json
